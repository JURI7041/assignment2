<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Book movie tickets online. Choose a movie, screening time, ticket type and pay by voucher or online payment.">
    <meta name="keywords" content="movies tickets booking">
    <meta name="author" content="Juri Alodhailah">
    
    <title>BOOK TICKETS | FILM FINDER</title>
    <!-- css and scripts are linked on every page -->
    <link rel="stylesheet" href="css/style.css">
    <script src="js/jquery.min.js"></script>
    <script src="js/script.js"></script>
</head>

<body>
    <!-- HEADER - logo, site name and main navigation (same on every page) -->
    <header>
        <img src="images/logo.png" alt="Film Finder logo">
        <h1>FILM FINDER</h1>

        <nav>
            <ul>
                <!-- class="active" highlights the page the user is on -->
                <li><a href="index.html">Home</a></li>
                <li><a href="movies.html">Movies</a></li>
                <li><a href="recommend.html">Recommendations</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="booking.html" class="active">Book Tickets</a></li>
                <li><a href="watchlist.html">Watchlist</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Book Your Tickets</h2>
            <p>All fields are required unless marked optional.</p>

            <!-- novalidate turns off the browser's own checks so script.js can validate instead -->           
            <form id="bookingForm" method="post" action="http://mercury.swin.edu.au/it000000/cos10005/regtest.php" novalidate>
                
                <!-- customer details -->               
                <fieldset>
                    <legend>Your Details</legend>

                    <div class="form-row">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName">
                    </div>

                    <!--rule: valid email format-->
                    <div class="form-row">
                        <label for="email">Email Address</label>
                        <input type="text" id="email" name="email">
                    </div>

                    <!--rule: digits only, 10-->
                    <div class="form-row">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                </fieldset>

                <!-- movie, session and ticket details -->
                <fieldset>
                    <legend>Movie and Tickets</legend>

                    <!-- the options in this dropdown are loaded from movies.xml by script.js -->
                    <div class="form-row">
                        <label for="movie">Movie</label>
                        <select name="movie" id="movie">
                            <option value="">-- Select a movie --</option>
                        </select>
                        <!-- shown only if movies.xml cannot be loaded -->
                        <span class="error" id="movieError"></span>
                    </div>

                    <!-- rule: must not be in the past -->
                    <div class="form-row">
                        <label for="screening">Screening Date and Time</label>
                        <input type="datetime-local" id="screening" name="screening">
                    </div>

                    <!-- rule: must be greater than 0 -->
                    <div class="form-row">
                        <label for="tickets">Number of Tickets</label>
                        <input type="number" id="tickets" name="tickets" value="1" min="1">
                    </div>

                    <div class="form-row">
                        <label for="ticketType">Ticket Type</label>
                        <select name="ticketType" id="ticketType">
                            <option value="Adult">Adult</option>
                            <option value="Child">Child</option>
                            <option value="Student">Student</option>
                        </select>
                    </div>

                    <!-- optional field, so it is not validated -->
                    <div class="form-row">
                        <label for="requests">Special Requests (optional)</label>
                        <textarea name="requests" id="requests" rows="3"></textarea>
                    </div>

                    <!-- read-only: script.js works these out from the movie and number of tickets -->
                    <div class="form-row">
                        <label for="price">Tickets Price</label>
                        <input type="text" id="price" name="price" value="$0.00" readonly>
                    </div>

                    <div class="form-row">
                        <label for="totalCost">Total Booking Cost</label>
                        <input type="text" id="totalCost" name="totalCost" value="$0.00" readonly>
                    </div>
                </fieldset>

                <!-- payment details -->
                <fieldset>
                    <legend>Payment</legend>

                    <!-- payment method: the choice decides which fields below are shown -->
                    <fieldset>
                        <legend>Payment Method</legend>
                        <input type="radio" id="payVoucher" name="payment" value="Voucher">
                        <label for="payVoucher">Voucher</label>

                        <input type="radio" id="payOnline" name="payment" value="Online">
                        <label for="payOnline">Online Payment</label>
                    </fieldset>

                    <!-- shown only when Voucher is selected (12 digits, not validated) -->
                    <div id="voucherSection" class="hidden">
                        <div class="form-row">
                            <label for="voucherCode">Voucher Code (12 digits)</label>
                            <input type="text" id="voucherCode" name="voucherCode" maxlength="12">
                        </div>
                    </div>

                    <!-- shown only when Online Payment is selected -->
                    <div id="cardSection" class="hidden">
                        <div class="form-row">
                            <label for="cardType">Card Type</label>
                            <select name="cardType" id="cardType">
                                <option value="Visa">Visa</option>
                                <option value="Mastercard">Mastercard</option>
                                <option value="Amex">Amex</option>
                            </select>
                        </div>

                        <!-- rule: digits only, 16 for Visa/Mastercard, 15 for Amex -->
                        <div class="form-row">
                            <label for="cardNumber">Card Number</label>
                            <input type="text" id="cardNumber" name="cardNumber">
                        </div>
                    </div>

                        <!-- billing email: the checkbox copies the email above into this field -->
                        <div class="form-row">
                            <label for="billingEmail">Billing Email Address</label>
                            <input type="text" id="billingEmail" name="billingEmail">
                        </div>

                        <div class="form-row">
                            <input type="checkbox" id="sameEmail" name="sameEmail">
                            <label for="sameEmail">Same as Email Address</label>
                        </div>
                </fieldset>
                <button type="submit">Confirm Booking</button>
            </form>
        </section>
    </main>

    <!-- footer-->
    <footer>
        <p>&copy;2026 Film Finder. Created by Juri Alodhailah</p>
    </footer>

</body>
</html>
