<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View and manage the movies you have saved to your Film Finder watchlist.">
    <meta name="keywords" content="movies tickets booking">
    <meta name="author" content="Juri Alodhailah">
    
    <title>WATCHLIST | FILM FINDER</title>
    <!-- css and scripts are linked on every page -->
    <link rel="stylesheet" href="css/style.css">
    <script src="js/jquery.min.js"></script>
    <script src="js/script.js"></script>
</head>

<body>
    <!-- HEADER - logo, site name and main navigation (same on every page) -->
    <header>
        <img src="images/logo.png" alt="Film Finder logo">
        <h1>FILM FINDER</h1>

        <nav>
            <ul>
                <!-- class="active" highlights the page the user is on -->
                <li><a href="index.html">Home</a></li>
                <li><a href="movies.html">Movies</a></li>
                <li><a href="recommend.html">Recommendations</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="booking.html">Book Tickets</a></li>
                <li><a href="watchlist.html" class="active">Watchlist</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- watchlist: movie cards are drawn here by script.js from sessionStorage -->
        <section>
            <h2>My Watchlist</h2>
            <p>Movies you saved from the Movies page appear here.</p>
            
            <!-- shown by script.js when the watchlist is empty -->
            <p id="emptyMessage" class="hidden">Your watchlist is empty! Visit the <a href="movies.html">Movies page</a> to add some.</p>
        
            <!-- script.js fills this div with one card per saved movie -->
            <div id="watchlistItems"></div>
        </section>
    </main>

    <!-- footer-->
    <footer>
        <p>&copy;2026 Film Finder. Created by Juri Alodhailah</p>
    </footer>

</body>
</html>
